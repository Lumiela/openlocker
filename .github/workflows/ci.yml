name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "k8s/**"
      - "**.md"
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/lumiela/openlocker

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: openlocker:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name app -p 8000:8000 openlocker:test
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz; then break; fi
            sleep 1
          done
          echo
          curl -fsS http://localhost:8000/readyz
          echo
          curl -fsS -o /dev/null -w "index %{http_code}\n" http://localhost:8000/

      - name: Container logs on failure
        if: failure()
        run: docker logs app

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  update-tag:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.TAG_PUSH_TOKEN }}

      - name: Set image tag in overlay
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          sed -i "s/newTag: .*/newTag: ${TAG}/" k8s/overlays/homelab/kustomization.yaml
          git diff

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "k8s: image sha-${GITHUB_SHA::7} [auto]"
          git push
