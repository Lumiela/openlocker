apiVersion: v1
kind: Service
metadata:
 name: postgres
 namespace: openlocker
spec:
 clusterIP: None
 selector:
   app: postgres
 ports:
 - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
 name: postgres
 namespace: openlocker
spec:
 serviceName: postgres
 replicas: 1
 selector:
   matchLabels:
     app: postgres
 template:
   metadata:
     labels:
       app: postgres
   spec:
     containers:
       - name: postgres
         image: postgres:17
         ports:
           - containerPort: 5432
         envFrom:
           - secretRef:
               name: openlocker-db
         env:
           - name: PGDATA
             value: /var/lib/postgresql/data/pgdata
         volumeMounts:
           - name: pgdata
             mountPath: /var/lib/postgresql/data
         readinessProbe:
           exec:
             command:
               - pg_isready
               - -U
               - openlocker
           periodSeconds: 5
         resources:
           requests:
             cpu: 100m
             memory: 256Mi
           limits:
             cpu: 500m
             memory: 512Mi
 volumeClaimTemplates:
   - metadata:
       name: pgdata
     spec:
       accessModes:
         - ReadWriteOnce
       storageClassName: local-path
       resources:
         requests:
           storage: 1Gi
