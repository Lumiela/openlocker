apiVersion: apps/v1
kind: Deployment
metadata:
  name: openlocker
  namespace: openlocker
  labels:
    app: openlocker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openlocker
  template:
    metadata:
      labels:
        app: openlocker
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: openlocker
          image: ghcr.io/lumiela/openlocker:sha-6a09a21
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: openlocker-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: openlocker-db
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
