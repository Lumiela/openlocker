apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openlocker
  namespace: openlocker
spec:
  ingressClassName: traefik
  rules:
    - host: phantom
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openlocker
                port:
                  number: 8000
