apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openlocker
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Lumiela/openlocker.git
    targetRevision: main
    path: k8s/overlays/homelab
  destination:
    server: https://kubernetes.default.svc
    namespace: openlocker
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
